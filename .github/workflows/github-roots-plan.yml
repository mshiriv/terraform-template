name: GitHub Roots Plan

# Plan visibility for the github/* roots. These roots manage GitHub itself
# (branch-protection rulesets), so the main terraform-plan matrix excludes them:
# planning a ruleset needs a GitHub token with administration:read, which the
# workflow token does not have. This workflow mints a short-lived GitHub App
# installation token (administration:read) and posts each github root's plan to
# the PR.
#
# Apply stays OUT OF BAND (the App token is read-only; applies run with an
# admin token, see github/repo-management/README.md). This is intentionally NOT
# a required status check: the paths filter means it doesn't run on PRs that
# don't touch github/**, so requiring it would block those PRs forever.
#
# Off until the repository variable CI_GITHUB_ROOTS_ENABLED is "true" and the
# TF_GH_APP_ID / TF_GH_APP_PRIVATE_KEY secrets exist (SETUP.md).

on:
  pull_request:
    paths:
      - "github/**"

permissions:
  contents: read
  pull-requests: write # post-tf-comment posts the plan to the PR
  id-token: write # OIDC for the management-account AWS role (state bucket)

concurrency:
  group: github-roots-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Keep in sync with .terraform-version.
  TF_VERSION: "1.16.6"

jobs:
  plan:
    name: "github-plan: ${{ matrix.directory }}"
    if: vars.CI_GITHUB_ROOTS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The github/* roots. Add new ones here (there are usually only a
        # couple, so a static list beats wiring them into detect-changes.sh).
        directory:
          - github/repo-management

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # administration:read installation token for the github provider's
      # plan-time refresh of the ruleset. Owner-level so it covers every
      # managed repo.
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.TF_GH_APP_ID }}
          private-key: ${{ secrets.TF_GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # github roots keep their state in the management-account S3 bucket.
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_MANAGEMENT }}
          aws-region: us-east-1

      - name: Terraform Init
        working-directory: ${{ matrix.directory }}
        run: terraform init -input=false

      - name: Terraform Plan
        id: plan
        working-directory: ${{ matrix.directory }}
        env:
          # github provider auth (administration:read) for the plan refresh.
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -o pipefail
          terraform plan -no-color -input=false -lock=false 2>&1 | tee plan.txt
        continue-on-error: true

      - name: Post plan to PR
        continue-on-error: true
        uses: ./.github/actions/post-tf-comment
        with:
          directory: ${{ matrix.directory }}
          kind: plan
          label: GitHub
          outcome: ${{ steps.plan.outcome }}
          file-name: plan.txt
          github-token: ${{ github.token }}

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1
