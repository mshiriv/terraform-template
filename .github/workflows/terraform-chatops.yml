name: Terraform ChatOps

on:
  issue_comment:
    types: [created]

concurrency:
  # Namespace must stay distinct from terraform-plan.yml's: concurrency groups are
  # repository-wide, not per-workflow. Sharing one let that workflow's
  # cancel-in-progress: true kill an in-flight apply — see the comment there.
  group: terraform-apply-pr-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  pull-requests: write
  # The apply gate (check-approval job) calls github.rest.checks.listForRef to
  # verify plan-summary + Pre-commit Checks are green for the head SHA before
  # applying. That read needs `checks: read`; without it the call throws
  # "Resource not accessible by integration" and the gate crashes before it can
  # evaluate the approval / admin break-glass, blocking every chatops apply.
  checks: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Keep in sync with .terraform-version.
  TF_VERSION: "1.16.6"
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.tf-plugin-cache
  # See terraform-plan.yml: lets the shared plugin cache coexist with the
  # gitignored-lockfile policy instead of failing init on a checksum mismatch.
  TF_PLUGIN_CACHE_MAY_BREAK_DEPENDENCY_LOCK_FILE: "1"

jobs:
  # -------------------------------------------------------------------
  # Job 1: Parse comment, GATE on membership (plan AND apply), fetch PR context.
  # The membership gate lives here so every downstream job inherits it: an
  # unauthorized commenter never reaches OIDC credentials or `terraform plan`.
  # -------------------------------------------------------------------
  parse:
    name: Parse Command
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, 'terraform ') &&
      contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    outputs:
      command: ${{ steps.parse.outputs.command }}
      directory: ${{ steps.parse.outputs.directory }}
      ref: ${{ steps.pr.outputs.ref }}
      sha: ${{ steps.pr.outputs.sha }}
      base_ref: ${{ steps.pr.outputs.base_ref }}

    steps:
      - name: Add reaction
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes'
            });

      # Authoritative permission check (author_association in the job `if:` is a
      # coarse pre-filter; this enforces real repo write/admin via the API).
      - name: Authorize commenter
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { data: perm } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.actor
            });
            if (!['admin', 'write'].includes(perm.permission)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `❌ @${context.actor} does not have write access — \`terraform\` commands are not allowed.`
              });
              core.setFailed(`${context.actor} lacks write access (${perm.permission})`);
            }

      - name: Parse comment
        id: parse
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // Only the first line is the command. Lines below it are free-text
            // notes for reviewers (e.g. the expected diff) and are ignored; an
            // annotated apply used to be rejected as an unrecognised command.
            const command = context.payload.comment.body.trim().split(/\r?\n/, 1)[0].trim();
            // Restrict the directory to a path allow-list (no shell metacharacters).
            const match = command.match(/^terraform\s+(plan|apply)(?:\s+([A-Za-z0-9._/-]+))?$/);
            const usage = 'Use `terraform plan [dir]` or `terraform apply [dir]` on the first line (dir = a root path like `aws/accounts/staging/eu-west-1/01-foundation`; omit it to target every root the PR changes); notes may follow on later lines.';
            if (!match) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `❌ Unrecognised command: \`${command}\`.\n${usage}`
              });
              core.setFailed(`Unrecognised command: "${command}".`);
              return;
            }
            const dir = match[2] || '';
            if (dir.includes('..')) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `❌ Invalid directory \`${dir}\` (path traversal not allowed).`
              });
              core.setFailed(`Invalid directory: "${dir}".`);
              return;
            }
            core.setOutput('command', match[1]);
            core.setOutput('directory', dir);

      - name: Get PR details
        id: pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            core.setOutput('ref', pr.data.head.ref);
            core.setOutput('sha', pr.data.head.sha);
            core.setOutput('base_ref', pr.data.base.ref);

      - name: Signal failure reaction
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'confused'
            });

  # -------------------------------------------------------------------
  # Job 2: Detect changed Terraform directories
  # -------------------------------------------------------------------
  detect-changes:
    name: Detect Changes
    needs: parse
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      aws_dirs: ${{ steps.split.outputs.aws_dirs }}
      azure_dirs: ${{ steps.split.outputs.azure_dirs }}
      datadog_dirs: ${{ steps.split.outputs.datadog_dirs }}
      has_aws: ${{ steps.split.outputs.has_aws }}
      has_azure: ${{ steps.split.outputs.has_azure }}
      has_datadog: ${{ steps.split.outputs.has_datadog }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.parse.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changed Terraform directories
        id: changes
        env:
          DIR: ${{ needs.parse.outputs.directory }}
          BASE_REF: ${{ needs.parse.outputs.base_ref }}
        run: |
          # If a specific directory was requested, use that (value comes via env —
          # never interpolated into the shell).
          if [[ -n "$DIR" ]]; then
            if [[ ! -f "$DIR/backend.tf" ]]; then
              echo "::error::Directory '$DIR' is not a Terraform root (no backend.tf)"
              exit 1
            fi
            if ! scripts/detect-changes.sh --check "$DIR"; then
              echo "::error::'$DIR' is applied out-of-band, not by CI (bootstrap, github/*, or a .ci-skip root). See its README."
              exit 1
            fi
            ALL_DIRS=$(jq -nc --arg d "$DIR" '[$d]')
          else
            ALL_DIRS=$(scripts/detect-changes.sh "$BASE_REF")
          fi
          echo "dirs=$ALL_DIRS" >> "$GITHUB_OUTPUT"

      - name: Split by cloud
        id: split
        uses: ./.github/actions/split-roots
        with:
          dirs: ${{ steps.changes.outputs.dirs }}
          aws-enabled: ${{ vars.CI_AWS_ENABLED }}
          azure-enabled: ${{ vars.CI_AZURE_ENABLED }}
          datadog-enabled: ${{ vars.CI_DATADOG_ENABLED }}

      # A chatops command is explicit intent: silently skipping a root because
      # its cloud isn't wired up yet would read as success. Fail loudly instead.
      - name: Reject roots of clouds without CI enabled
        if: steps.split.outputs.disabled_dirs != '[]'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DISABLED: ${{ steps.split.outputs.disabled_dirs }}
        with:
          script: |
            const dirs = JSON.parse(process.env.DISABLED).map(d => `\`${d}\``).join(', ');
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `❌ CI is not enabled for the cloud of: ${dirs}. Set the matching \`CI_<CLOUD>_ENABLED\` repository variable to \`true\` once its credentials are configured (SETUP.md).`
            });
            core.setFailed(`CI not enabled for: ${dirs}`);

  # -------------------------------------------------------------------
  # Job 3: Gate — require approved review + green plan/scan checks before apply
  # -------------------------------------------------------------------
  check-approval:
    name: Check PR Approval
    needs: [parse, detect-changes]
    if: needs.parse.outputs.command == 'apply'
    runs-on: ubuntu-latest
    # Up to 15 min waiting for in-flight checks (below), plus API calls.
    timeout-minutes: 20
    steps:
      - name: Require green checks + an approved review
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          HEAD_SHA: ${{ needs.parse.outputs.sha }}
        with:
          script: |
            const sha = process.env.HEAD_SHA;
            const fail = async (msg) => {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body: msg
              });
              core.setFailed(msg.replace(/[*`❌⚠️]/g, '').trim());
            };

            // 1. Required checks must be green for the exact head SHA (this is how
            //    scans/lint gate the apply path — checkov/trivy/tflint run in the
            //    plan workflow's "Pre-commit Checks", aggregated by "plan-summary").
            //    `terraform apply` is often commented right after a push, while the
            //    plan workflow is still running; that used to fail as "missing" and
            //    had to be re-commented. Wait for queued/in-progress checks instead.
            const required = ['plan-summary', 'Pre-commit Checks'];
            const deadline = Date.now() + 15 * 60 * 1000;
            let latest;
            for (;;) {
              const checks = await github.paginate(github.rest.checks.listForRef, {
                owner: context.repo.owner, repo: context.repo.repo, ref: sha, per_page: 100
              });
              // A re-run adds a new check run on the same SHA; judge each name by its newest run.
              latest = {};
              for (const c of checks) {
                const prev = latest[c.name];
                if (!prev || c.started_at > prev.started_at || (c.started_at === prev.started_at && c.id > prev.id)) latest[c.name] = c;
              }
              const pending = required.filter(n => latest[n]?.status !== 'completed');
              if (!pending.length || Date.now() > deadline) break;
              core.info(`Waiting for ${pending.map(n => `${n} (${latest[n]?.status || 'not started'})`).join(', ')} on ${sha.slice(0,7)}…`);
              await new Promise(r => setTimeout(r, 20000));
            }
            const state = n => latest[n] ? (latest[n].conclusion || latest[n].status) : 'missing';
            const notGreen = required.filter(n => latest[n]?.conclusion !== 'success');
            if (notGreen.length) {
              return fail(`❌ **Apply blocked.** Required checks not green for \`${sha.slice(0,7)}\`: ${notGreen.map(n => `\`${n}\` (${state(n)})`).join(', ')}. Plan/scan must pass before apply.`);
            }

            // The apply checks out the SHA captured when the comment was made. If
            // the PR moved on while we waited, applying it would apply a commit
            // the PR no longer contains.
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner, repo: context.repo.repo, pull_number: context.issue.number
            });
            if (pr.head.sha !== sha) {
              return fail(`❌ **Apply blocked.** The PR head moved from \`${sha.slice(0,7)}\` to \`${pr.head.sha.slice(0,7)}\` after the command was posted. Comment \`terraform apply\` again to apply the new head.`);
            }

            // 2. An approved review by someone OTHER than the actor, on the head SHA.
            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner: context.repo.owner, repo: context.repo.repo, pull_number: context.issue.number
            });
            const approved = reviews.some(r =>
              r.state === 'APPROVED' && r.commit_id === sha && r.user.login !== context.actor
            );
            if (approved) { core.info('Approved review present for head SHA.'); return; }

            // 3. Break-glass: admins may proceed without an approval, but loudly
            //    (audited) — never silently.
            const { data: perm } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner, repo: context.repo.repo, username: context.actor
            });
            if (perm.permission === 'admin') {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `⚠️ **Admin override:** @${context.actor} is applying without an approved review of \`${sha.slice(0,7)}\`. This is audited.`
              });
              core.warning(`Admin override by ${context.actor}`);
              return;
            }
            return fail('❌ **Apply blocked.** This PR has no approved review of the latest commit by someone other than you (you cannot approve your own PR). Admins can override, which is audited in the PR.');

  # -------------------------------------------------------------------
  # Job 4: Terraform Plan/Apply — AWS
  # -------------------------------------------------------------------
  aws:
    name: "${{ needs.parse.outputs.command == 'plan' && 'Plan' || 'Apply' }}: ${{ matrix.directory }}"
    needs: [parse, detect-changes, check-approval]
    if: |
      always() &&
      needs.parse.result == 'success' &&
      needs.detect-changes.outputs.has_aws == 'true' &&
      needs.detect-changes.result == 'success' &&
      (needs.parse.outputs.command == 'plan' || needs.check-approval.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: terraform-aws-${{ matrix.directory }}
      cancel-in-progress: false
    strategy:
      matrix:
        directory: ${{ fromJson(needs.detect-changes.outputs.aws_dirs) }}
      max-parallel: 1
      fail-fast: true

    # GitHub Environment for apply jobs (plan needs no gate). Each environment
    # can carry required reviewers / wait timers, and its name is part of the
    # OIDC subject the account's CI role trusts (aws/accounts/*/github-oidc).
    # Management-account roots share 'organization' with aws/organization.
    environment: ${{ needs.parse.outputs.command == 'apply' && (contains(matrix.directory, 'aws/accounts/production/') && 'production' || (startsWith(matrix.directory, 'aws/organization') || startsWith(matrix.directory, 'aws/accounts/management/')) && 'organization' || contains(matrix.directory, 'aws/accounts/staging/') && 'staging' || 'sandbox') || '' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.parse.outputs.sha }}
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Resolve AWS role
        id: account
        uses: ./.github/actions/resolve-aws-role
        with:
          directory: ${{ matrix.directory }}
          role-production: ${{ secrets.AWS_ROLE_PRODUCTION }}
          role-staging: ${{ secrets.AWS_ROLE_STAGING }}
          role-sandbox: ${{ secrets.AWS_ROLE_SANDBOX }}
          role-management: ${{ secrets.AWS_ROLE_MANAGEMENT }}

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ steps.account.outputs.role-arn }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Configure private module access
        uses: ./.github/actions/tf-modules-token
        with:
          app-id: ${{ secrets.TF_MODULES_APP_ID }}
          private-key: ${{ secrets.TF_MODULES_APP_PRIVATE_KEY }}
          owner: ${{ vars.TF_MODULES_OWNER }}
          repositories: ${{ vars.TF_MODULES_REPOS || 'terraform-modules' }}

      # Exact key per root, no restore-keys fallback (see terraform-plan.yml).
      - name: Cache provider plugins
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: tf-plugins-v2-${{ runner.os }}-${{ hashFiles(format('{0}/providers.tf', matrix.directory)) }}

      - name: Terraform Init
        working-directory: ${{ matrix.directory }}
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          terraform init -input=false

      # ---------- Plan ----------
      # -lock-timeout (here and on apply): PR plans don't share this job's
      # concurrency group, so a PR plan can hold the root's state lock for a
      # minute or two. Wait for it instead of failing the apply on contention.
      - name: Terraform Plan
        if: needs.parse.outputs.command == 'plan'
        working-directory: ${{ matrix.directory }}
        id: plan
        run: |
          set -o pipefail
          terraform plan -no-color -input=false -lock-timeout=10m -out=tfplan 2>&1 | tee plan.txt
        continue-on-error: true

      - name: Post plan to PR
        if: needs.parse.outputs.command == 'plan'
        continue-on-error: true
        uses: ./.github/actions/post-tf-comment
        with:
          directory: ${{ matrix.directory }}
          kind: plan
          label: ${{ steps.account.outputs.env }}
          outcome: ${{ steps.plan.outcome }}
          file-name: plan.txt
          github-token: ${{ github.token }}

      - name: Fail if plan failed
        if: needs.parse.outputs.command == 'plan' && steps.plan.outcome == 'failure'
        run: exit 1

      # ---------- Apply ----------
      - name: Terraform Apply
        if: needs.parse.outputs.command == 'apply'
        working-directory: ${{ matrix.directory }}
        id: apply
        run: |
          set -o pipefail
          terraform apply -auto-approve -no-color -input=false -lock-timeout=10m 2>&1 | tee apply.txt
        continue-on-error: true

      - name: Post apply result to PR
        if: needs.parse.outputs.command == 'apply'
        continue-on-error: true
        uses: ./.github/actions/post-tf-comment
        with:
          directory: ${{ matrix.directory }}
          kind: apply
          label: ${{ steps.account.outputs.env }}
          outcome: ${{ steps.apply.outcome }}
          file-name: apply.txt
          github-token: ${{ github.token }}

      - name: Fail if apply failed
        if: needs.parse.outputs.command == 'apply' && steps.apply.outcome == 'failure'
        run: exit 1

  # -------------------------------------------------------------------
  # Job 5: Terraform Plan/Apply — Azure
  # -------------------------------------------------------------------
  azure:
    name: "${{ needs.parse.outputs.command == 'plan' && 'Plan' || 'Apply' }}: ${{ matrix.directory }}"
    needs: [parse, detect-changes, check-approval]
    if: |
      always() &&
      needs.parse.result == 'success' &&
      needs.detect-changes.outputs.has_azure == 'true' &&
      needs.detect-changes.result == 'success' &&
      (needs.parse.outputs.command == 'plan' || needs.check-approval.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: terraform-azure-${{ matrix.directory }}
      cancel-in-progress: false
    strategy:
      matrix:
        directory: ${{ fromJson(needs.detect-changes.outputs.azure_dirs) }}
      max-parallel: 1
      fail-fast: true

    environment: ${{ needs.parse.outputs.command == 'apply' && (startsWith(matrix.directory, 'azure/production/') && 'production' || 'staging') || '' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.parse.outputs.sha }}
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Resolve Azure subscription
        id: azure
        uses: ./.github/actions/resolve-azure-subscription
        with:
          directory: ${{ matrix.directory }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-production: ${{ secrets.AZURE_SUBSCRIPTION_PRODUCTION }}
          subscription-staging: ${{ secrets.AZURE_SUBSCRIPTION_STAGING }}

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ steps.azure.outputs.client-id }}
          tenant-id: ${{ steps.azure.outputs.tenant-id }}
          subscription-id: ${{ steps.azure.outputs.subscription-id }}

      - name: Configure private module access
        uses: ./.github/actions/tf-modules-token
        with:
          app-id: ${{ secrets.TF_MODULES_APP_ID }}
          private-key: ${{ secrets.TF_MODULES_APP_PRIVATE_KEY }}
          owner: ${{ vars.TF_MODULES_OWNER }}
          repositories: ${{ vars.TF_MODULES_REPOS || 'terraform-modules' }}

      # Exact key per root, no restore-keys fallback (see terraform-plan.yml).
      - name: Cache provider plugins
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: tf-plugins-v2-${{ runner.os }}-${{ hashFiles(format('{0}/providers.tf', matrix.directory)) }}

      - name: Terraform Init
        working-directory: ${{ matrix.directory }}
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          terraform init -input=false

      # ---------- Plan ----------
      - name: Terraform Plan
        if: needs.parse.outputs.command == 'plan'
        working-directory: ${{ matrix.directory }}
        id: plan
        run: |
          set -o pipefail
          terraform plan -no-color -input=false -lock-timeout=10m -out=tfplan 2>&1 | tee plan.txt
        continue-on-error: true

      - name: Post plan to PR
        if: needs.parse.outputs.command == 'plan'
        continue-on-error: true
        uses: ./.github/actions/post-tf-comment
        with:
          directory: ${{ matrix.directory }}
          kind: plan
          label: Azure ${{ steps.azure.outputs.environment }}
          outcome: ${{ steps.plan.outcome }}
          file-name: plan.txt
          github-token: ${{ github.token }}

      - name: Fail if plan failed
        if: needs.parse.outputs.command == 'plan' && steps.plan.outcome == 'failure'
        run: exit 1

      # ---------- Apply ----------
      - name: Terraform Apply
        if: needs.parse.outputs.command == 'apply'
        working-directory: ${{ matrix.directory }}
        id: apply
        run: |
          set -o pipefail
          terraform apply -auto-approve -no-color -input=false -lock-timeout=10m 2>&1 | tee apply.txt
        continue-on-error: true

      - name: Post apply result to PR
        if: needs.parse.outputs.command == 'apply'
        continue-on-error: true
        uses: ./.github/actions/post-tf-comment
        with:
          directory: ${{ matrix.directory }}
          kind: apply
          label: Azure ${{ steps.azure.outputs.environment }}
          outcome: ${{ steps.apply.outcome }}
          file-name: apply.txt
          github-token: ${{ github.token }}

      - name: Fail if apply failed
        if: needs.parse.outputs.command == 'apply' && steps.apply.outcome == 'failure'
        run: exit 1

  # -------------------------------------------------------------------
  # Job 6: Terraform Plan/Apply — Datadog
  # -------------------------------------------------------------------
  datadog:
    name: "${{ needs.parse.outputs.command == 'plan' && 'Plan' || 'Apply' }}: ${{ matrix.directory }}"
    needs: [parse, detect-changes, check-approval]
    if: |
      always() &&
      needs.parse.result == 'success' &&
      needs.detect-changes.outputs.has_datadog == 'true' &&
      needs.detect-changes.result == 'success' &&
      (needs.parse.outputs.command == 'plan' || needs.check-approval.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: terraform-datadog-${{ matrix.directory }}
      cancel-in-progress: false
    strategy:
      matrix:
        directory: ${{ fromJson(needs.detect-changes.outputs.datadog_dirs) }}
      max-parallel: 1
      fail-fast: true

    environment: ${{ needs.parse.outputs.command == 'apply' && 'datadog' || '' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.parse.outputs.sha }}
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # Datadog state lives in the management account's bucket.
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_MANAGEMENT }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      # Exact key per root, no restore-keys fallback (see terraform-plan.yml).
      - name: Cache provider plugins
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: tf-plugins-v2-${{ runner.os }}-${{ hashFiles(format('{0}/providers.tf', matrix.directory)) }}

      - name: Terraform Init
        working-directory: ${{ matrix.directory }}
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          terraform init -input=false

      # ---------- Plan ----------
      - name: Terraform Plan
        if: needs.parse.outputs.command == 'plan'
        working-directory: ${{ matrix.directory }}
        id: plan
        env:
          DATADOG_API_KEY: ${{ secrets.DATADOG_API_KEY }}
          DATADOG_APP_KEY: ${{ secrets.DATADOG_APP_KEY }}
        run: |
          set -o pipefail
          terraform plan -no-color -input=false -lock-timeout=10m -out=tfplan 2>&1 | tee plan.txt
        continue-on-error: true

      - name: Post plan to PR
        if: needs.parse.outputs.command == 'plan'
        continue-on-error: true
        uses: ./.github/actions/post-tf-comment
        with:
          directory: ${{ matrix.directory }}
          kind: plan
          label: Datadog
          outcome: ${{ steps.plan.outcome }}
          file-name: plan.txt
          github-token: ${{ github.token }}

      - name: Fail if plan failed
        if: needs.parse.outputs.command == 'plan' && steps.plan.outcome == 'failure'
        run: exit 1

      # ---------- Apply ----------
      - name: Terraform Apply
        if: needs.parse.outputs.command == 'apply'
        working-directory: ${{ matrix.directory }}
        id: apply
        env:
          DATADOG_API_KEY: ${{ secrets.DATADOG_API_KEY }}
          DATADOG_APP_KEY: ${{ secrets.DATADOG_APP_KEY }}
        run: |
          set -o pipefail
          terraform apply -auto-approve -no-color -input=false -lock-timeout=10m 2>&1 | tee apply.txt
        continue-on-error: true

      - name: Post apply result to PR
        if: needs.parse.outputs.command == 'apply'
        continue-on-error: true
        uses: ./.github/actions/post-tf-comment
        with:
          directory: ${{ matrix.directory }}
          kind: apply
          label: Datadog
          outcome: ${{ steps.apply.outcome }}
          file-name: apply.txt
          github-token: ${{ github.token }}

      - name: Fail if apply failed
        if: needs.parse.outputs.command == 'apply' && steps.apply.outcome == 'failure'
        run: exit 1

  # -------------------------------------------------------------------
  # Job 7: Final status reaction on the triggering comment
  # -------------------------------------------------------------------
  status:
    name: Status
    needs: [parse, check-approval, aws, azure, datadog]
    if: always() && needs.parse.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Set final reaction
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          R_APPROVAL: ${{ needs.check-approval.result }}
          R_AWS: ${{ needs.aws.result }}
          R_AZURE: ${{ needs.azure.result }}
          R_DATADOG: ${{ needs.datadog.result }}
        with:
          script: |
            const all = [process.env.R_APPROVAL, process.env.R_AWS, process.env.R_AZURE, process.env.R_DATADOG];
            const ran = all.filter(r => r && r !== 'skipped' && r !== '');
            // Nothing actually executed (e.g. apply blocked at approval) → 'confused',
            // never a false 🚀.
            const reaction = ran.length === 0
              ? 'confused'
              : (ran.every(r => r === 'success') ? 'rocket' : '-1');
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: reaction
            });
